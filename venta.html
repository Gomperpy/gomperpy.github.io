<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gomper · Venta en persona</title>
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg: #FBF6F1; --ink: #4A3845; --ink-2: #776873; --line: #EADDE3; --mint: #A9DCC3; --mint-fuerte: #3B7A5B;
    --pink: #F2A3C0; --pink-fuerte: #B03E68; --pink-claro: #FDEDF2; --lilac-claro: #F1EAFB; --danger: #B42318; --ok: #1F7A4D; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  header img { width: 52px; height: 52px; border-radius: 50%; }
  h1 { font-size: 22px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
  .caja { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .ll { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .ll-cab { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 6px; }
  .ll-cab button { border: 0; background: none; color: var(--danger); font-weight: 700; font-size: 14px; padding: 6px; }
  label.t { display: block; font-weight: 800; font-size: 14px; margin: 10px 0 5px; }
  select, input[type=text], input[type=number], input[type=password] { width: 100%; font-size: 17px; padding: 11px 12px; border: 1.5px solid #D8C8D0; border-radius: 12px; background: #fff; color: var(--ink); }
  .colgs { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1.5px solid #D8C8D0; background: #fff; border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .chip.on { background: var(--lilac-claro); border-color: #B79BD9; }
  .chip.extra { background: var(--pink-claro); border-color: var(--pink); }
  .chip:disabled { opacity: 0.4; }
  .ayuda { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .sub { text-align: right; font-weight: 800; margin-top: 10px; }
  .btn { border: 1.5px solid #D8C8D0; background: #fff; border-radius: 999px; padding: 11px 16px; font-size: 15px; font-weight: 800; color: var(--ink); }
  .fila { display: flex; gap: 10px; align-items: center; }
  .fila > * { flex: 1; }
  .recordar { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-top: 8px; color: var(--ink-2); }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1.5px solid var(--line); box-shadow: 0 -8px 20px rgba(74,56,69,.08); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .barra-in { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .barra-in .tot { flex: 1; font-weight: 800; }
  .barra-in .tot small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 700; }
  .wa { border: 0; background: var(--ok); color: #fff; border-radius: 999px; padding: 14px 20px; font-size: 16px; font-weight: 800; }
  .wa:disabled { opacity: .6; }
  #msg { margin: 12px 0; font-weight: 800; border-radius: 14px; padding: 12px 14px; display: none; }
  #msg.err { display: block; background: #FBE3E0; color: var(--danger); }
  #msg.ok { display: block; background: #E3F4EA; color: var(--ok); }
  .cargando { text-align: center; color: var(--ink-2); padding: 30px 0; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo-gomper.webp" alt="" width="52" height="52">
    <div><h1>Venta en persona</h1><p>Descuenta el stock y suma la venta en la Caja.</p></div>
  </header>

  <div class="caja">
    <label class="t" for="pin" style="margin-top:0">PIN de ventas</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••">
    <label class="recordar"><input type="checkbox" id="recordar"> Recordar en este dispositivo</label>
  </div>

  <div id="lista"><p class="cargando">Cargando stock…</p></div>
  <button class="btn" id="mas" type="button" hidden>+ Agregar otro llavero</button>

  <div class="caja" style="margin-top:12px">
    <label class="t" for="cliente" style="margin-top:0">Cliente (opcional)</label>
    <input type="text" id="cliente" placeholder="Ej: María" autocomplete="off">
    <div class="fila">
      <div><label class="t" for="medio">Medio de pago</label>
        <select id="medio"><option>Efectivo</option><option>Transferencia</option><option>QR / billetera</option><option>Tarjeta</option><option>Otro</option></select></div>
      <div><label class="t" for="total">Total cobrado</label><input type="number" id="total" inputmode="numeric" min="0" step="1000"></div>
    </div>
    <div class="ayuda" id="lista-precio"></div>
  </div>
  <div id="msg" role="status"></div>
</main>
<div class="barra"><div class="barra-in">
  <div class="tot"><span id="tot-txt">Gs. 0</span><small id="tot-det">0 llaveros</small></div>
  <button class="wa" id="guardar" type="button" disabled>Registrar venta</button>
</div></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxup5llIngMMpMTGD13_eAF-W7FjvsRfzUbvs5wew-Uab_lW2Vi0-Kgj-spp9Sg9SjJ/exec';
var D = null, cordones = [], colgantes = [], byId = {}, L = {};
var ll = [], totalTocado = false, enviando = false;
function $(id) { return document.getElementById(id); }
function gs(n) { return 'Gs. ' + String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function guardado(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function limpiar(s) {
  s = String(s || '').toUpperCase().replace(/Ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'Ñ');
  return s.replace(/[^A-ZÑ]/g, '').slice(0, L.maxLetras || 10);
}
function elegidos(l) { return Object.keys(l.colg).filter(function (k) { return l.colg[k]; }); }
function precio(l) {
  var c = byId[l.cordon], p = c ? c.precio : 0, ids = elegidos(l);
  ids.forEach(function (id) { p += (byId[id] || {}).precio || 0; });
  return p + Math.max(0, ids.length - L.colgantesIncluidos) * L.precioColganteExtra;
}
function total() { return ll.reduce(function (a, l) { return a + precio(l); }, 0); }
function usado(id, menos) { // unidades ya elegidas en esta venta (para no pasarse del stock)
  return ll.reduce(function (a, l, i) { return a + (i === menos ? 0 : (l.cordon === id ? 1 : 0) + (l.colg[id] ? 1 : 0)); }, 0);
}
function pintar() {
  var h = '';
  ll.forEach(function (l, i) {
    var ids = elegidos(l);
    h += '<div class="ll"><div class="ll-cab"><span>Llavero ' + (i + 1) + '</span>' + (ll.length > 1 ? '<button type="button" data-quitar="' + i + '">Quitar</button>' : '') + '</div>';
    h += '<label class="t">Cordón</label><select data-i="' + i + '" data-campo="cordon"><option value="">Elegí un cordón…</option>';
    cordones.forEach(function (c) {
      var quedan = c.stock - usado(c.id, i);
      h += '<option value="' + esc(c.id) + '"' + (l.cordon === c.id ? ' selected' : '') + (quedan <= 0 && l.cordon !== c.id ? ' disabled' : '') + '>' + esc(c.nombre) + (quedan <= 0 ? ' (sin stock)' : ' (' + quedan + ')') + '</option>';
    });
    h += '</select><label class="t">Nombre</label><input type="text" data-i="' + i + '" data-campo="nombre" value="' + esc(l.nombre) + '" autocomplete="off" autocapitalize="characters" placeholder="Solo letras, hasta ' + L.maxLetras + '">';
    h += '<label class="t">Colgantes <span class="ayuda">' + ids.length + ' de ' + L.maxColgantes + ' · ' + L.colgantesIncluidos + ' incluidos, el 3.º suma ' + gs(L.precioColganteExtra) + '</span></label><div class="colgs">';
    colgantes.forEach(function (c) {
      var on = !!l.colg[c.id], quedan = c.stock - usado(c.id, i), lleno = ids.length >= L.maxColgantes;
      var esExtra = on && ids.indexOf(c.id) >= L.colgantesIncluidos;
      h += '<button type="button" class="chip' + (on ? ' on' : '') + (esExtra ? ' extra' : '') + '" data-i="' + i + '" data-colg="' + esc(c.id) + '"' + ((quedan <= 0 || lleno) && !on ? ' disabled' : '') + '>' + esc(c.nombre) + (quedan <= 0 && !on ? ' (0)' : '') + '</button>';
    });
    h += '</div><div class="sub">Subtotal: ' + gs(precio(l)) + '</div></div>';
  });
  $('lista').innerHTML = h;
  $('mas').hidden = false;
  $('mas').disabled = ll.length >= L.maxLlaveros;
  actualizarTotal();
}
function actualizarTotal() {
  var t = total();
  if (!totalTocado) $('total').value = t || '';
  $('lista-precio').textContent = 'Precio de lista: ' + gs(t) + (totalTocado ? ' · cambiaste el total a mano' : '');
  $('tot-txt').textContent = gs(Number($('total').value) || 0);
  $('tot-det').textContent = ll.length + (ll.length === 1 ? ' llavero' : ' llaveros');
  $('guardar').disabled = enviando || !D;
}
function nuevo() { ll.push({ cordon: '', nombre: '', colg: {} }); pintar(); }
function mensaje(txt, cls) { var m = $('msg'); m.className = cls || ''; m.innerHTML = txt; if (cls) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

function cargar() {
  return fetch(API_URL + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (data) {
    if (!data.ok) throw new Error('sin datos');
    D = data; L = data.limites || {}; byId = {};
    var porOrden = function (a, b) { return (a.orden || 0) - (b.orden || 0); };
    data.items.forEach(function (it) { byId[it.id] = it; });
    cordones = data.items.filter(function (i) { return i.categoria === 'cordon'; }).sort(porOrden);
    colgantes = data.items.filter(function (i) { return i.categoria === 'colgante'; }).sort(porOrden);
    if (!ll.length) nuevo(); else pintar();
  }).catch(function () {
    $('lista').innerHTML = '<p class="cargando">No se pudo cargar el stock. Revisá la conexión y recargá la página.</p>';
  });
}

$('lista').addEventListener('change', function (e) {
  var t = e.target, i = Number(t.getAttribute('data-i'));
  if (t.getAttribute('data-campo') === 'cordon') { ll[i].cordon = t.value; pintar(); }
});
$('lista').addEventListener('input', function (e) {
  var t = e.target;
  if (t.getAttribute('data-campo') !== 'nombre') return;
  var i = Number(t.getAttribute('data-i')), v = limpiar(t.value);
  if (v !== t.value) t.value = v;
  ll[i].nombre = v;
});
$('lista').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-quitar')) { ll.splice(Number(b.getAttribute('data-quitar')), 1); pintar(); return; }
  if (b.hasAttribute('data-colg')) {
    var l = ll[Number(b.getAttribute('data-i'))], id = b.getAttribute('data-colg');
    l.colg[id] = !l.colg[id];
    if (!l.colg[id]) delete l.colg[id];
    pintar();
  }
});
$('mas').addEventListener('click', nuevo);
$('total').addEventListener('input', function () { totalTocado = $('total').value !== ''; actualizarTotal(); });

var pinGuardado = guardado('gomper-pin');
if (pinGuardado) { $('pin').value = pinGuardado; $('recordar').checked = true; }

$('guardar').addEventListener('click', function () {
  var faltan = [];
  if (!$('pin').value.trim()) faltan.push('Escribí el PIN de ventas.');
  ll.forEach(function (l, i) {
    if (!l.cordon) faltan.push('Llavero ' + (i + 1) + ': elegí el cordón.');
    if (!l.nombre) faltan.push('Llavero ' + (i + 1) + ': falta el nombre.');
    if (elegidos(l).length < (L.minColgantes || 1)) faltan.push('Llavero ' + (i + 1) + ': elegí al menos ' + (L.minColgantes || 1) + ' colgante.');
  });
  if (faltan.length) { mensaje(faltan.map(esc).join('<br>'), 'err'); return; }
  enviando = true; actualizarTotal(); $('guardar').textContent = 'Registrando…'; mensaje('', '');
  var datos = {
    accion: 'ventaPersona', pin: $('pin').value.trim(),
    cliente: $('cliente').value.trim(), medio: $('medio').value, total: Number($('total').value) || 0,
    llaveros: ll.map(function (l) { return { cordon: l.cordon, nombre: l.nombre, colgantes: elegidos(l).map(function (id) { return { id: id, cantidad: 1 }; }) }; })
  };
  fetch(API_URL, { method: 'POST', body: JSON.stringify(datos) }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r.ok) {
      if (r.pin === false) { guardado('gomper-pin', null); $('pin').focus(); }
      mensaje((r.errores || ['No se pudo registrar.']).map(esc).join('<br>'), 'err');
      return;
    }
    if ($('recordar').checked) guardado('gomper-pin', datos.pin); else guardado('gomper-pin', null);
    mensaje('✓ Venta #' + esc(r.codigo) + ' registrada por ' + gs(r.total) + '. Se descontó el stock y entró en la Caja.', 'ok');
    ll = []; totalTocado = false; $('cliente').value = ''; $('total').value = '';
    return cargar();
  }).catch(function () {
    mensaje('No se pudo confirmar la venta (problema de conexión). Antes de reintentar, fijate en la hoja Pedidos si quedó registrada.', 'err');
  }).then(function () {
    enviando = false; $('guardar').textContent = 'Registrar venta'; actualizarTotal();
  });
});
cargar();
</script>
</body>
</html>
